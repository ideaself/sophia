name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The app ships for Windows; verify on the same platform it ships on.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage gates
        run: npm run test:coverage

      - name: Security baseline
        run: npm run test:security

      - name: Build
        run: npm run build
