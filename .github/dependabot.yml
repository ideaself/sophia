version: 2

updates:
  # Runtime + dev dependencies: minor/patch updates are grouped into one PR,
  # majors stay individual so breaking changes can be reviewed on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keep the workflow actions current (they are pinned to major versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
